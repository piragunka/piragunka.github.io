<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>MAX User ID</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        main {
            width: 100%;
            max-width: 600px;
            padding: 24px;
            border-radius: 16px;
            background: white;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .label {
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        #user-id {
            margin-top: 8px;
            padding: 16px;
            border-radius: 12px;
            background: #eeeeee;
            font-size: 26px;
            font-weight: bold;
            word-break: break-all;
        }

        #status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            background: #eeeeee;
        }

        #debug {
            margin-top: 16px;
            padding: 12px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            border-radius: 10px;
            background: #eeeeee;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Данные пользователя MAX</h1>

        <div class="label">ID пользователя</div>

        <div id="user-id">
            Получение ID...
        </div>

        <div id="status">
            Страница загружена, разбираем параметры запуска.
        </div>

        <pre id="debug"></pre>
    </main>

    <script>
    (() => {
        "use strict";

        const userIdElement =
            document.getElementById("user-id");

        const statusElement =
            document.getElementById("status");

        const debugElement =
            document.getElementById("debug");

        /**
         * Повторяет логику SDK MAX:
         * сначала смотрит location.hash,
         * затем исходный URL navigation entry,
         * затем sessionStorage.
         */
        function getLaunchParameter(parameterName) {
            try {
                const currentHash =
                    window.location.hash.replace(/^#/, "");

                const currentParameters =
                    new URLSearchParams(currentHash);

                const currentValue =
                    currentParameters.get(parameterName);

                if (currentValue) {
                    sessionStorage.setItem(
                        parameterName,
                        currentValue
                    );

                    return currentValue;
                }

                const navigationEntry =
                    performance.getEntriesByType("navigation")[0];

                if (navigationEntry && navigationEntry.name) {
                    const navigationUrl =
                        new URL(navigationEntry.name);

                    const navigationHash =
                        navigationUrl.hash.replace(/^#/, "");

                    const navigationParameters =
                        new URLSearchParams(navigationHash);

                    const navigationValue =
                        navigationParameters.get(parameterName);

                    if (navigationValue) {
                        sessionStorage.setItem(
                            parameterName,
                            navigationValue
                        );

                        return navigationValue;
                    }
                }

                return sessionStorage.getItem(parameterName);
            } catch (error) {
                console.error(
                    "Ошибка получения параметра:",
                    error
                );

                return null;
            }
        }

        function showError(message, error) {
            userIdElement.textContent = "ID не найден";
            statusElement.textContent = message;

            debugElement.textContent = [
                `URL: ${window.location.href}`,
                `Hash: ${window.location.hash || "(пустой)"}`,
                error
                    ? `Ошибка: ${error.message || error}`
                    : ""
            ]
                .filter(Boolean)
                .join("\n");
        }

        function readMaxUser() {
            try {
                const rawWebAppData =
                    getLaunchParameter("WebAppData");

                if (!rawWebAppData) {
                    showError(
                        "Параметр WebAppData отсутствует. Вероятно, страница открыта не через мини-приложение MAX."
                    );

                    return;
                }

                /*
                 * В SDK применяется decodeURIComponent
                 * ко всей строке WebAppData.
                 */
                let decodedWebAppData;

                try {
                    decodedWebAppData =
                        decodeURIComponent(rawWebAppData);
                } catch {
                    decodedWebAppData = rawWebAppData;
                }

                const initDataParameters =
                    new URLSearchParams(decodedWebAppData);

                const rawUser =
                    initDataParameters.get("user");

                if (!rawUser) {
                    showError(
                        "WebAppData найден, но объект user отсутствует."
                    );

                    debugElement.textContent +=
                        `\n\nWebAppData:\n${decodedWebAppData}`;

                    return;
                }

                const user = JSON.parse(rawUser);

                /*
                 * В данных мини-приложения обычно используется id.
                 * user_id добавлен как запасной вариант.
                 */
                const userId =
                    user.id ?? user.user_id ?? null;

                if (userId === null) {
                    showError(
                        "Объект пользователя получен, но поле id отсутствует."
                    );

                    debugElement.textContent +=
                        `\n\nUser:\n${JSON.stringify(
                            user,
                            null,
                            2
                        )}`;

                    return;
                }

                userIdElement.textContent = String(userId);

                statusElement.textContent =
                    "ID пользователя успешно получен.";

                debugElement.textContent = [
                    `Имя: ${user.first_name || "не указано"}`,
                    `Фамилия: ${user.last_name || "не указана"}`,
                    `Username: ${user.username || "не указан"}`,
                    `Язык: ${user.language_code || "не указан"}`,
                    `start_param: ${
                        initDataParameters.get("start_param") ||
                        "не передан"
                    }`
                ].join("\n");
            } catch (error) {
                showError(
                    "Произошла ошибка при разборе данных MAX.",
                    error
                );
            }
        }

        readMaxUser();
    })();
    </script>
</body>
</html>
