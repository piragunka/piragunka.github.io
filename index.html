<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Переход в канал</title>

    <script>
    (() => {
        "use strict";

        /*
         * Ссылка на канал MAX.
         */
        const CHANNEL_URL =
            "https://max.ru/join/ObH6FMhjvGkMBbVgfdD9CZPEBdUB0KR78kR2RqtgcdE";

        /*
         * Интервал повторной проверки транспорта MAX.
         */
        const RETRY_INTERVAL_MS = 10;

        /*
         * Максимальное количество проверок транспорта.
         *
         * 100 попыток × 10 мс = примерно 1 секунда.
         */
        const MAX_ATTEMPTS = 100;

        /*
         * Через сколько начинать резервную загрузку SDK.
         */
        const SDK_LOAD_DELAY_MS = 10;

        /*
         * Через сколько выполнить обычный переход.
         *
         * Было 1200 мс, теперь 400 мс.
         */
        const FALLBACK_REDIRECT_DELAY_MS = 100;

        let bridgeCommandSent = false;
        let attempts = 0;

        /**
         * Отправляет команду открытия канала
         * непосредственно через транспорт MAX.
         *
         * Возвращает true, когда подходящий
         * транспорт найден и команда отправлена.
         */
        function sendDirectCommand() {
            try {
                /*
                 * Веб-клиент MAX:
                 * мини-приложение работает внутри iframe.
                 */
                if (window.self !== window.top) {
                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppReady"
                        }),
                        "*"
                    );

                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppOpenMaxLink",
                            url: CHANNEL_URL
                        }),
                        "*"
                    );

                    bridgeCommandSent = true;

                    return true;
                }

                /*
                 * Нативный WebView MAX:
                 * Android, iOS, Windows или macOS.
                 */
                if (
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent ===
                        "function"
                ) {
                    window.WebViewHandler.postEvent(
                        "WebAppReady",
                        "{}"
                    );

                    window.WebViewHandler.postEvent(
                        "WebAppOpenMaxLink",
                        JSON.stringify({
                            url: CHANNEL_URL
                        })
                    );

                    bridgeCommandSent = true;

                    return true;
                }

                /*
                 * Официальный MAX Bridge уже доступен.
                 */
                if (
                    window.WebApp &&
                    typeof window.WebApp.openMaxLink ===
                        "function"
                ) {
                    if (
                        typeof window.WebApp.ready ===
                            "function"
                    ) {
                        window.WebApp.ready();
                    }

                    window.WebApp.openMaxLink(
                        CHANNEL_URL
                    );

                    bridgeCommandSent = true;

                    return true;
                }
            } catch (error) {
                console.error(
                    "Ошибка вызова MAX Bridge:",
                    error
                );
            }

            return false;
        }

        /*
         * Первая попытка выполняется немедленно,
         * ещё до загрузки содержимого body.
         */
        sendDirectCommand();

        /*
         * Некоторые клиенты внедряют WebViewHandler
         * не сразу, поэтому быстро повторяем проверку.
         */
        const retryTimer = setInterval(() => {
            attempts += 1;

            if (!bridgeCommandSent) {
                sendDirectCommand();
            }

            if (
                bridgeCommandSent ||
                attempts >= MAX_ATTEMPTS
            ) {
                clearInterval(retryTimer);
            }
        }, RETRY_INTERVAL_MS);

        /*
         * Если встроенный транспорт не обнаружен,
         * быстро загружаем официальный MAX Bridge.
         */
        setTimeout(() => {
            if (bridgeCommandSent) {
                return;
            }

            const script =
                document.createElement("script");

            script.src =
                "https://st.max.ru/js/max-web-app.js";

            script.async = true;

            script.onload = () => {
                sendDirectCommand();
            };

            script.onerror = () => {
                console.error(
                    "Не удалось загрузить официальный MAX Bridge"
                );
            };

            document.head.appendChild(script);
        }, SDK_LOAD_DELAY_MS);

        /*
         * Последний резервный вариант.
         *
         * Нужен для обычного браузера и для случаев,
         * когда MAX не обработал команду Bridge.
         */
        setTimeout(() => {
            try {
                window.location.replace(
                    CHANNEL_URL
                );
            } catch (error) {
                console.error(
                    "Ошибка обычного перехода:",
                    error
                );
            }
        }, FALLBACK_REDIRECT_DELAY_MS);

        /*
         * В этом файле намеренно отсутствуют:
         *
         * - WebAppClose;
         * - window.WebApp.close();
         * - visibilitychange;
         * - blur;
         * - pagehide;
         * - таймеры закрытия мини-приложения.
         */
    })();
    </script>

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 24px;
        }

        #status {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div id="status">
        Открываем канал…
    </div>
</body>
</html>
