<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Открываем канал</title>

    <script>
    (() => {
        "use strict";

        /*
         * Укажите здесь ссылку на ваш канал MAX.
         */
        const CHANNEL_URL = "https://max.ru/your_channel";

        let transitionStarted = false;

        /**
         * Пытается напрямую обратиться к мосту MAX.
         *
         * Этот способ не требует загрузки полного max-web-app.js.
         */
        function openThroughNativeBridge() {
            if (transitionStarted) {
                return true;
            }

            try {
                /*
                 * MAX Web: мини-приложение запущено внутри iframe.
                 */
                if (window.self !== window.top) {
                    transitionStarted = true;

                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppOpenMaxLink",
                            url: CHANNEL_URL
                        }),
                        "*"
                    );

                    return true;
                }

                /*
                 * Нативный клиент MAX:
                 * Android, iOS или Desktop.
                 */
                if (
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent === "function"
                ) {
                    transitionStarted = true;

                    window.WebViewHandler.postEvent(
                        "WebAppOpenMaxLink",
                        JSON.stringify({
                            url: CHANNEL_URL
                        })
                    );

                    return true;
                }

                /*
                 * Официальный SDK уже подключён.
                 */
                if (
                    window.WebApp &&
                    typeof window.WebApp.openMaxLink === "function"
                ) {
                    transitionStarted = true;
                    window.WebApp.openMaxLink(CHANNEL_URL);

                    return true;
                }
            } catch (error) {
                console.error("Ошибка перехода через MAX Bridge:", error);
            }

            return false;
        }

        /**
         * Загружает официальный MAX Bridge только тогда,
         * когда прямой нативный мост недоступен.
         */
        function loadOfficialBridge() {
            const script = document.createElement("script");

            script.src = "https://st.max.ru/js/max-web-app.js";
            script.async = true;

            script.addEventListener("load", () => {
                if (!openThroughNativeBridge()) {
                    showManualLink();
                }
            });

            script.addEventListener("error", () => {
                showManualLink();
            });

            document.head.appendChild(script);
        }

        function showManualLink() {
            document.documentElement.classList.add("show-page");
        }

        /*
         * Первая попытка выполняется сразу при разборе HTML.
         * Не ждём DOMContentLoaded или window.load.
         */
        if (!openThroughNativeBridge()) {
            loadOfficialBridge();
        }

        /*
         * На некоторых клиентах нативный мост может появиться
         * чуть позже начала выполнения страницы.
         */
        setTimeout(() => {
            if (!transitionStarted) {
                openThroughNativeBridge();
            }
        }, 50);
    })();
    </script>

    <style>
        html:not(.show-page) body {
            visibility: hidden;
        }

        body {
            box-sizing: border-box;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            text-align: center;
        }

        a {
            display: inline-block;
            padding: 14px 20px;
            border-radius: 12px;
            background: #000;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main>
        <p>Автоматический переход не выполнился.</p>

        <p>
            <a href="https://max.ru/your_channel">
                Открыть канал
            </a>
        </p>
    </main>
</body>
</html>
