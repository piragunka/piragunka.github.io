<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Переход в канал 2</title>

    <script>
    (() => {
        "use strict";

        const CHANNEL_URL =
            "https://max.ru/join/ObH6FMhjvGkMBbVgfdD9CZPEBdUB0KR78kR2RqtgcdE";

        let bridgeCommandSent = false;
        let attempts = 0;

        /**
         * Отправляет команду открытия ссылки
         * непосредственно через транспорт MAX.
         */
        function sendDirectCommand() {
            try {
                /*
                 * Веб-клиент MAX:
                 * мини-приложение запущено внутри iframe.
                 */
                if (window.self !== window.top) {
                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppReady"
                        }),
                        "*"
                    );

                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppOpenMaxLink",
                            url: CHANNEL_URL
                        }),
                        "*"
                    );

                    bridgeCommandSent = true;

                    return true;
                }

                /*
                 * Нативный WebView MAX:
                 * Android, iOS или Desktop.
                 */
                if (
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent ===
                        "function"
                ) {
                    window.WebViewHandler.postEvent(
                        "WebAppReady",
                        "{}"
                    );

                    window.WebViewHandler.postEvent(
                        "WebAppOpenMaxLink",
                        JSON.stringify({
                            url: CHANNEL_URL
                        })
                    );

                    bridgeCommandSent = true;

                    return true;
                }

                /*
                 * Официальный SDK уже доступен.
                 */
                if (
                    window.WebApp &&
                    typeof window.WebApp.openMaxLink ===
                        "function"
                ) {
                    if (
                        typeof window.WebApp.ready ===
                            "function"
                    ) {
                        window.WebApp.ready();
                    }

                    window.WebApp.openMaxLink(
                        CHANNEL_URL
                    );

                    bridgeCommandSent = true;

                    return true;
                }
            } catch (error) {
                console.error(
                    "Ошибка вызова MAX Bridge:",
                    error
                );
            }

            return false;
        }

        /*
         * Первая попытка выполняется немедленно.
         */
        sendDirectCommand();

        /*
         * Мост может появиться спустя несколько
         * десятков миллисекунд.
         */
        const retryTimer = setInterval(() => {
            attempts += 1;

            if (!bridgeCommandSent) {
                sendDirectCommand();
            }

            if (
                bridgeCommandSent ||
                attempts >= 40
            ) {
                clearInterval(retryTimer);
            }
        }, 25);

        /*
         * Резервная загрузка официального SDK.
         */
        setTimeout(() => {
            if (bridgeCommandSent) {
                return;
            }

            const script =
                document.createElement("script");

            script.src =
                "https://st.max.ru/js/max-web-app.js";

            script.async = true;

            script.onload = () => {
                sendDirectCommand();
            };

            script.onerror = () => {
                console.error(
                    "Не удалось загрузить официальный MAX Bridge"
                );
            };

            document.head.appendChild(script);
        }, 100);

        /*
         * Исходный резервный переход.
         *
         * Оставлен в том же виде, как в рабочем варианте.
         */
        setTimeout(() => {
            try {
                window.location.replace(
                    CHANNEL_URL
                );
            } catch (error) {
                console.error(
                    "Ошибка обычного перехода:",
                    error
                );
            }
        }, 1200);
    })();
    </script>

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 24px;
        }

        #status {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div id="status">
        Открываем канал…
    </div>
</body>
</html>
