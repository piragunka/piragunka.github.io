<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Переход в канал</title>

    <script>
    (() => {
        "use strict";

        const CHANNEL_URL =
            "https://max.ru/join/ObH6FMhjvGkMBbVgfdD9CZPEBdUB0KR78kR2RqtgcdE";

        /*
         * Минимальное время между командой открытия канала
         * и командой закрытия мини-приложения.
         *
         * Это НЕ резервное закрытие.
         * WebAppClose будет отправлен только после
         * visibilitychange → hidden.
         */
        const MIN_CLOSE_DELAY_AFTER_OPEN_MS = 300;

        let activeTransport = null;
        let bridgeCommandSent = false;
        let closeCommandSent = false;
        let openCommandTime = 0;
        let attempts = 0;

        /**
         * Отправляет событие через выбранный транспорт MAX.
         */
        function sendEvent(type, payload = {}) {
            try {
                if (activeTransport === "iframe") {
                    window.parent.postMessage(
                        JSON.stringify({
                            type,
                            ...payload
                        }),
                        "*"
                    );

                    return true;
                }

                if (
                    activeTransport === "webview" &&
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent ===
                        "function"
                ) {
                    window.WebViewHandler.postEvent(
                        type,
                        JSON.stringify(payload)
                    );

                    return true;
                }

                if (
                    activeTransport === "sdk" &&
                    window.WebApp
                ) {
                    if (
                        type === "WebAppReady" &&
                        typeof window.WebApp.ready ===
                            "function"
                    ) {
                        window.WebApp.ready();
                        return true;
                    }

                    if (
                        type === "WebAppOpenMaxLink" &&
                        typeof window.WebApp.openMaxLink ===
                            "function"
                    ) {
                        window.WebApp.openMaxLink(
                            payload.url
                        );

                        return true;
                    }

                    if (
                        type === "WebAppClose" &&
                        typeof window.WebApp.close ===
                            "function"
                    ) {
                        window.WebApp.close();
                        return true;
                    }
                }
            } catch (error) {
                console.error(
                    "Ошибка отправки события " + type + ":",
                    error
                );
            }

            return false;
        }

        /**
         * Закрывает мини-приложение один раз.
         */
        function closeMiniApp() {
            if (
                !bridgeCommandSent ||
                closeCommandSent ||
                !activeTransport
            ) {
                return;
            }

            closeCommandSent = true;

            console.log(
                "Канал перевёл мини-приложение в фон. " +
                "Отправляем WebAppClose."
            );

            sendEvent("WebAppClose");
        }

        /**
         * Закрытие запускается только после того,
         * как страница действительно стала hidden.
         */
        function closeAfterBackgrounding() {
            if (
                !bridgeCommandSent ||
                closeCommandSent
            ) {
                return;
            }

            const elapsed =
                performance.now() - openCommandTime;

            const remainingDelay = Math.max(
                0,
                MIN_CLOSE_DELAY_AFTER_OPEN_MS - elapsed
            );

            /*
             * Таймер запускается только после hidden.
             * Без события hidden закрытия не будет.
             */
            setTimeout(() => {
                /*
                 * Повторно проверяем состояние.
                 * Если страница опять стала видимой,
                 * закрывать её не нужно.
                 */
                if (
                    document.visibilityState === "hidden"
                ) {
                    closeMiniApp();
                }
            }, remainingDelay);
        }

        /*
         * Используем только visibilitychange.
         *
         * blur удалён: он срабатывал слишком рано.
         * pagehide удалён: он может происходить при
         * уничтожении или навигации самого документа.
         */
        document.addEventListener(
            "visibilitychange",
            () => {
                console.log(
                    "visibilityState:",
                    document.visibilityState
                );

                if (
                    document.visibilityState === "hidden"
                ) {
                    closeAfterBackgrounding();
                }
            }
        );

        /**
         * Находит транспорт MAX и открывает канал.
         */
        function sendDirectCommand() {
            if (bridgeCommandSent) {
                return true;
            }

            try {
                /*
                 * В нативных клиентах сначала проверяем
                 * WebViewHandler.
                 */
                if (
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent ===
                        "function"
                ) {
                    activeTransport = "webview";
                } else if (
                    window.self !== window.top
                ) {
                    /*
                     * Web MAX и некоторые desktop-клиенты.
                     */
                    activeTransport = "iframe";
                } else if (
                    window.WebApp &&
                    typeof window.WebApp.openMaxLink ===
                        "function"
                ) {
                    activeTransport = "sdk";
                } else {
                    return false;
                }

                sendEvent("WebAppReady");

                /*
                 * Запоминаем момент непосредственно
                 * перед отправкой открытия канала.
                 */
                openCommandTime = performance.now();
                bridgeCommandSent = true;

                const sent = sendEvent(
                    "WebAppOpenMaxLink",
                    {
                        url: CHANNEL_URL
                    }
                );

                if (!sent) {
                    bridgeCommandSent = false;
                    activeTransport = null;
                    openCommandTime = 0;

                    return false;
                }

                console.log(
                    "WebAppOpenMaxLink отправлен через:",
                    activeTransport
                );

                return true;
            } catch (error) {
                bridgeCommandSent = false;
                activeTransport = null;
                openCommandTime = 0;

                console.error(
                    "Ошибка открытия канала:",
                    error
                );

                return false;
            }
        }

        /*
         * Первая попытка — немедленно.
         */
        sendDirectCommand();

        /*
         * Ждём появления встроенного моста до одной секунды.
         */
        const retryTimer = setInterval(() => {
            attempts += 1;

            if (!bridgeCommandSent) {
                sendDirectCommand();
            }

            if (
                bridgeCommandSent ||
                attempts >= 40
            ) {
                clearInterval(retryTimer);
            }
        }, 25);

        /*
         * Подключаем официальный SDK только тогда,
         * когда встроенный транспорт не появился.
         */
        setTimeout(() => {
            if (bridgeCommandSent) {
                return;
            }

            const script =
                document.createElement("script");

            script.src =
                "https://st.max.ru/js/max-web-app.js";

            script.async = true;

            script.onload = () => {
                sendDirectCommand();
            };

            script.onerror = () => {
                console.error(
                    "Не удалось загрузить MAX Bridge"
                );

                const status =
                    document.getElementById("status");

                if (status) {
                    status.textContent =
                        "Не удалось открыть канал";
                }
            };

            document.head.appendChild(script);
        }, 100);

        /*
         * Здесь намеренно отсутствует:
         *
         * - резервное закрытие по времени;
         * - blur;
         * - pagehide;
         * - location.replace();
         */
    })();
    </script>

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 24px;
        }

        #status {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div id="status">
        Открываем канал…
    </div>
</body>
</html>
