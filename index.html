<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Переход в канал</title>

    <script>
    (() => {
        "use strict";

        const CHANNEL_URL =
            "https://max.ru/join/ObH6FMhjvGkMBbVgfdD9CZPEBdUB0KR78kR2RqtgcdE";

        let activeTransport = null;
        let bridgeCommandSent = false;
        let closeCommandSent = false;
        let attempts = 0;

        /**
         * Отправляет событие в контейнер MAX.
         */
        function sendEvent(type, payload = {}) {
            try {
                /*
                 * Web-версия MAX и некоторые desktop-клиенты.
                 */
                if (activeTransport === "iframe") {
                    window.parent.postMessage(
                        JSON.stringify({
                            type,
                            ...payload
                        }),
                        "*"
                    );

                    return true;
                }

                /*
                 * Нативный WebView:
                 * Android, iOS, macOS, Windows.
                 */
                if (
                    activeTransport === "webview" &&
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent ===
                        "function"
                ) {
                    window.WebViewHandler.postEvent(
                        type,
                        JSON.stringify(payload)
                    );

                    return true;
                }

                /*
                 * Официальный MAX Bridge.
                 */
                if (
                    activeTransport === "sdk" &&
                    window.WebApp
                ) {
                    if (
                        type === "WebAppReady" &&
                        typeof window.WebApp.ready === "function"
                    ) {
                        window.WebApp.ready();
                        return true;
                    }

                    if (
                        type === "WebAppOpenMaxLink" &&
                        typeof window.WebApp.openMaxLink ===
                            "function"
                    ) {
                        window.WebApp.openMaxLink(
                            payload.url
                        );

                        return true;
                    }

                    if (
                        type === "WebAppClose" &&
                        typeof window.WebApp.close === "function"
                    ) {
                        window.WebApp.close();
                        return true;
                    }
                }
            } catch (error) {
                console.error(
                    "Ошибка отправки события " + type + ":",
                    error
                );
            }

            return false;
        }

        /**
         * Закрывает мини-приложение только один раз.
         */
        function closeMiniApp(reason) {
            if (
                !bridgeCommandSent ||
                closeCommandSent ||
                !activeTransport
            ) {
                return;
            }

            closeCommandSent = true;

            console.log(
                "Закрытие мини-приложения:",
                reason
            );

            sendEvent("WebAppClose");
        }

        /**
         * Регистрируем обработчики до открытия канала,
         * чтобы не пропустить быстрый уход страницы в фон.
         */
        document.addEventListener(
            "visibilitychange",
            () => {
                if (
                    document.visibilityState === "hidden"
                ) {
                    closeMiniApp(
                        "visibilitychange"
                    );
                }
            }
        );

        window.addEventListener(
            "pagehide",
            () => {
                closeMiniApp("pagehide");
            },
            {
                capture: true
            }
        );

        /*
         * В desktop-клиенте visibilitychange может
         * не сработать, но окно теряет фокус.
         */
        window.addEventListener(
            "blur",
            () => {
                if (
                    !bridgeCommandSent ||
                    closeCommandSent
                ) {
                    return;
                }

                /*
                 * Даём клиенту немного времени изменить
                 * фактическое состояние фокуса.
                 *
                 * Это не резервное закрытие:
                 * обработчик запускается только после blur.
                 */
                setTimeout(() => {
                    if (!document.hasFocus()) {
                        closeMiniApp("blur");
                    }
                }, 50);
            }
        );

        /**
         * Определяет транспорт и отправляет
         * команду открытия канала.
         */
        function sendDirectCommand() {
            if (bridgeCommandSent) {
                return true;
            }

            try {
                /*
                 * Web MAX или iframe desktop-клиента.
                 */
                if (window.self !== window.top) {
                    activeTransport = "iframe";
                } else if (
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent ===
                        "function"
                ) {
                    activeTransport = "webview";
                } else if (
                    window.WebApp &&
                    typeof window.WebApp.openMaxLink ===
                        "function"
                ) {
                    activeTransport = "sdk";
                } else {
                    return false;
                }

                /*
                 * Ставим флаг до отправки команды.
                 * Это важно, если visibilitychange
                 * сработает почти мгновенно.
                 */
                bridgeCommandSent = true;

                sendEvent("WebAppReady");

                const sent = sendEvent(
                    "WebAppOpenMaxLink",
                    {
                        url: CHANNEL_URL
                    }
                );

                if (!sent) {
                    bridgeCommandSent = false;
                    activeTransport = null;

                    return false;
                }

                return true;
            } catch (error) {
                bridgeCommandSent = false;
                activeTransport = null;

                console.error(
                    "Ошибка открытия канала:",
                    error
                );

                return false;
            }
        }

        /*
         * Первая попытка выполняется немедленно.
         */
        sendDirectCommand();

        /*
         * Некоторые клиенты внедряют мост
         * спустя несколько миллисекунд.
         */
        const retryTimer = setInterval(() => {
            attempts += 1;

            if (!bridgeCommandSent) {
                sendDirectCommand();
            }

            if (
                bridgeCommandSent ||
                attempts >= 40
            ) {
                clearInterval(retryTimer);
            }
        }, 25);

        /*
         * Резервно загружаем официальный SDK,
         * только если встроенный мост не обнаружен.
         *
         * Это резерв получения моста,
         * а не резервное закрытие приложения.
         */
        setTimeout(() => {
            if (bridgeCommandSent) {
                return;
            }

            const script =
                document.createElement("script");

            script.src =
                "https://st.max.ru/js/max-web-app.js";

            script.async = true;

            script.onload = () => {
                sendDirectCommand();
            };

            script.onerror = () => {
                console.error(
                    "Не удалось загрузить MAX Bridge"
                );

                const status =
                    document.getElementById("status");

                if (status) {
                    status.textContent =
                        "Не удалось открыть канал";
                }
            };

            document.head.appendChild(script);
        }, 100);
    })();
    </script>

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 24px;
        }

        #status {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div id="status">
        Открываем канал…
    </div>
</body>
</html>
