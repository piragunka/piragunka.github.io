<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Открываем канал</title>

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 24px;
        }

        #status {
            font-size: 18px;
        }
    </style>

    <script>
    (() => {
        "use strict";

        /*
         * УКАЖИТЕ ТОЧНУЮ ССЫЛКУ КАНАЛА.
         */
        const CHANNEL_URL =
            "https://max.ru/join/JdMSujHwZy1VyI52riP8lDjbA4lqzHN8rbbH9LCxvdo";

        let commandSent = false;
        let attempts = 0;

        /**
         * Отправляет команду открытия канала только один раз.
         */
        function openChannelOnce() {
            if (commandSent) {
                return true;
            }

            try {
                /*
                 * Нативное приложение MAX:
                 * macOS, Windows, Android, iOS.
                 */
                if (
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent ===
                        "function"
                ) {
                    commandSent = true;

                    window.WebViewHandler.postEvent(
                        "WebAppReady",
                        "{}"
                    );

                    window.WebViewHandler.postEvent(
                        "WebAppOpenMaxLink",
                        JSON.stringify({
                            url: CHANNEL_URL
                        })
                    );

                    return true;
                }

                /*
                 * Web-клиент и некоторые версии
                 * desktop-клиента используют iframe.
                 */
                if (window.self !== window.top) {
                    commandSent = true;

                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppReady"
                        }),
                        "*"
                    );

                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppOpenMaxLink",
                            url: CHANNEL_URL
                        }),
                        "*"
                    );

                    return true;
                }

                /*
                 * Официальный Bridge уже загружен.
                 */
                if (
                    window.WebApp &&
                    typeof window.WebApp.openMaxLink ===
                        "function"
                ) {
                    commandSent = true;

                    if (
                        typeof window.WebApp.ready ===
                            "function"
                    ) {
                        window.WebApp.ready();
                    }

                    window.WebApp.openMaxLink(
                        CHANNEL_URL
                    );

                    return true;
                }
            } catch (error) {
                console.error(
                    "Ошибка открытия канала:",
                    error
                );
            }

            return false;
        }

        /*
         * Первая попытка выполняется сразу в <head>.
         */
        if (openChannelOnce()) {
            return;
        }

        /*
         * На некоторых устройствах мост внедряется
         * через несколько миллисекунд после начала страницы.
         */
        const timer = setInterval(() => {
            attempts += 1;

            if (
                openChannelOnce() ||
                attempts >= 50
            ) {
                clearInterval(timer);
            }
        }, 10);

        /*
         * Только диагностическая надпись.
         * Никакого location.replace здесь нет.
         */
        setTimeout(() => {
            if (!commandSent) {
                const status =
                    document.getElementById("status");

                if (status) {
                    status.textContent =
                        "Не удалось обнаружить мост MAX";
                }
            }
        }, 600);
    })();
    </script>
</head>

<body>
    <div id="status">
        Открываем канал…
    </div>
</body>
</html>
