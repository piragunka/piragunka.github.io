<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Переход в канал</title>

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 24px;
        }

        #status {
            font-size: 18px;
        }
    </style>

    <script>
    (() => {
        "use strict";

        const CHANNEL_URL =
            "https://max.ru/join/ObH6FMhjvGkMBbVgfdD9CZPEBdUB0KR78kR2RqtgcdE";

        /*
         * Время, которое даём MAX на обработку openMaxLink.
         *
         * Это единственный практически применимый способ,
         * потому что подтверждения перехода API не возвращает.
         */
        const CLOSE_DELAY_MS = 900;

        let transitionStarted = false;

        /**
         * Проверяем, что страница действительно запущена
         * внутри мини-приложения MAX.
         */
        function isInsideMax() {
            const hash =
                window.location.hash || "";

            return (
                window.self !== window.top ||
                Boolean(window.WebViewHandler) ||
                hash.includes("WebAppData=") ||
                hash.includes("WebAppPlatform=")
            );
        }

        /**
         * Обычный браузер не имеет MAX Bridge.
         * Поэтому выполняем обычный переход.
         */
        if (!isInsideMax()) {
            window.location.replace(CHANNEL_URL);
            return;
        }

        /**
         * Загружаем официальный MAX Bridge.
         */
        const bridgeScript =
            document.createElement("script");

        bridgeScript.src =
            "https://st.max.ru/js/max-web-app.js";

        bridgeScript.async = false;

        bridgeScript.onload = () => {
            if (transitionStarted) {
                return;
            }

            transitionStarted = true;

            try {
                if (
                    !window.WebApp ||
                    typeof window.WebApp.openMaxLink !==
                        "function"
                ) {
                    throw new Error(
                        "MAX Bridge не предоставил openMaxLink"
                    );
                }

                if (
                    typeof window.WebApp.ready ===
                        "function"
                ) {
                    window.WebApp.ready();
                }

                /*
                 * Сначала отправляем команду открытия канала.
                 */
                window.WebApp.openMaxLink(
                    CHANNEL_URL
                );

                /*
                 * После паузы закрываем исходное
                 * мини-приложение.
                 *
                 * Не используем visibilitychange,
                 * blur или pagehide.
                 */
                setTimeout(() => {
                    try {
                        if (
                            window.WebApp &&
                            typeof window.WebApp.close ===
                                "function"
                        ) {
                            window.WebApp.close();
                        }
                    } catch (error) {
                        console.error(
                            "Ошибка закрытия мини-приложения:",
                            error
                        );
                    }
                }, CLOSE_DELAY_MS);
            } catch (error) {
                transitionStarted = false;

                console.error(
                    "Ошибка открытия канала:",
                    error
                );

                const status =
                    document.getElementById("status");

                if (status) {
                    status.textContent =
                        "Не удалось открыть канал";
                }
            }
        };

        bridgeScript.onerror = () => {
            console.error(
                "Не удалось загрузить MAX Bridge"
            );

            const status =
                document.getElementById("status");

            if (status) {
                status.textContent =
                    "Не удалось загрузить MAX Bridge";
            }
        };

        document.head.appendChild(
            bridgeScript
        );
    })();
    </script>
</head>

<body>
    <div id="status">
        Открываем канал…
    </div>
</body>
</html>
