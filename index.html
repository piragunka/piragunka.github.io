<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Переход в канал</title>

    <script>
    (() => {
        "use strict";

        /*
         * ВСТАВЬТЕ СЮДА ТОЧНУЮ ССЫЛКУ НА КАНАЛ MAX.
         */
        const CHANNEL_URL =
            "https://max.ru/join/JdMSujHwZy1VyI52riP8lDjbA4lqzHN8rbbH9LCxvdo";

        /*
         * Пауза перед закрытием исходного мини-приложения.
         *
         * Слишком маленькая задержка может привести к тому,
         * что приложение закроется раньше открытия канала.
         */
        const CLOSE_DELAY_MS = 350;

        let bridgeCommandSent = false;
        let closeScheduled = false;
        let attempts = 0;

        /**
         * Закрывает исходное мини-приложение.
         */
        function scheduleClose(transport) {
            if (closeScheduled) {
                return;
            }

            closeScheduled = true;

            setTimeout(() => {
                try {
                    /*
                     * Веб-клиент MAX или desktop через iframe.
                     */
                    if (transport === "iframe") {
                        window.parent.postMessage(
                            JSON.stringify({
                                type: "WebAppClose"
                            }),
                            "*"
                        );

                        return;
                    }

                    /*
                     * Нативный WebView:
                     * Android, iOS, macOS, Windows.
                     */
                    if (transport === "webview") {
                        window.WebViewHandler.postEvent(
                            "WebAppClose",
                            "{}"
                        );

                        return;
                    }

                    /*
                     * Официальный SDK.
                     */
                    if (
                        transport === "sdk" &&
                        window.WebApp &&
                        typeof window.WebApp.close === "function"
                    ) {
                        window.WebApp.close();
                    }
                } catch (error) {
                    console.error(
                        "Ошибка закрытия мини-приложения:",
                        error
                    );
                }
            }, CLOSE_DELAY_MS);
        }

        /**
         * Открывает канал через транспорт MAX.
         */
        function sendDirectCommand() {
            if (bridgeCommandSent) {
                return true;
            }

            try {
                /*
                 * Веб-клиент MAX:
                 * мини-приложение находится в iframe.
                 */
                if (window.self !== window.top) {
                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppReady"
                        }),
                        "*"
                    );

                    window.parent.postMessage(
                        JSON.stringify({
                            type: "WebAppOpenMaxLink",
                            url: CHANNEL_URL
                        }),
                        "*"
                    );

                    bridgeCommandSent = true;

                    scheduleClose("iframe");

                    return true;
                }

                /*
                 * Нативный WebView MAX:
                 * Android, iOS, macOS или Windows.
                 */
                if (
                    window.WebViewHandler &&
                    typeof window.WebViewHandler.postEvent ===
                        "function"
                ) {
                    window.WebViewHandler.postEvent(
                        "WebAppReady",
                        "{}"
                    );

                    window.WebViewHandler.postEvent(
                        "WebAppOpenMaxLink",
                        JSON.stringify({
                            url: CHANNEL_URL
                        })
                    );

                    bridgeCommandSent = true;

                    scheduleClose("webview");

                    return true;
                }

                /*
                 * Официальный SDK уже доступен.
                 */
                if (
                    window.WebApp &&
                    typeof window.WebApp.openMaxLink ===
                        "function"
                ) {
                    if (
                        typeof window.WebApp.ready ===
                            "function"
                    ) {
                        window.WebApp.ready();
                    }

                    window.WebApp.openMaxLink(
                        CHANNEL_URL
                    );

                    bridgeCommandSent = true;

                    scheduleClose("sdk");

                    return true;
                }
            } catch (error) {
                console.error(
                    "Ошибка вызова MAX Bridge:",
                    error
                );
            }

            return false;
        }

        /*
         * Первая попытка выполняется сразу в <head>.
         */
        sendDirectCommand();

        /*
         * На некоторых устройствах мост MAX появляется
         * через несколько десятков миллисекунд.
         */
        const retryTimer = setInterval(() => {
            attempts += 1;

            if (!bridgeCommandSent) {
                sendDirectCommand();
            }

            if (
                bridgeCommandSent ||
                attempts >= 40
            ) {
                clearInterval(retryTimer);
            }
        }, 25);

        /*
         * Резервно подключаем официальный SDK,
         * если встроенный транспорт не был обнаружен.
         */
        setTimeout(() => {
            if (bridgeCommandSent) {
                return;
            }

            const script =
                document.createElement("script");

            script.src =
                "https://st.max.ru/js/max-web-app.js";

            script.async = true;

            script.onload = () => {
                sendDirectCommand();
            };

            script.onerror = () => {
                console.error(
                    "Не удалось загрузить официальный MAX Bridge"
                );

                const status =
                    document.getElementById("status");

                if (status) {
                    status.textContent =
                        "Не удалось открыть канал";
                }
            };

            document.head.appendChild(script);
        }, 100);

        /*
         * ВАЖНО:
         *
         * Здесь больше нет location.replace().
         * Иначе веб-страница канала снова может
         * загрузиться внутри окна мини-приложения.
         */
    })();
    </script>

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 24px;
        }

        #status {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div id="status">
        Открываем канал…
    </div>
</body>
</html>
