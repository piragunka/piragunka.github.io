<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Открываем канал</title>

    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 24px;
        }
    </style>

    <script>
    (() => {
        "use strict";

        /*
         * Укажите точную ссылку на нужный канал MAX.
         */
        const CHANNEL_URL =
            "https://max.ru/join/JdMSujHwZy1VyI52riP8lDjbA4lqzHN8rbbH9LCxvdo";

        /*
         * Пауза между открытием канала
         * и закрытием мини-приложения.
         *
         * 180 мс — компромисс между скоростью
         * и тем, чтобы MAX успел обработать открытие.
         */
        const CLOSE_DELAY_MS = 180;

        let transitionStarted = false;
        let retryCount = 0;

        /**
         * Определяет транспорт, используемый MAX.
         */
        function getTransport() {
            /*
             * MAX Web и некоторые desktop-клиенты.
             * Именно iframe SDK проверяет первым.
             */
            if (window.self !== window.top) {
                return "iframe";
            }

            /*
             * Нативные клиенты MAX.
             */
            if (
                window.WebViewHandler &&
                typeof window.WebViewHandler.postEvent ===
                    "function"
            ) {
                return "webview";
            }

            /*
             * Официальный Bridge уже подключён.
             */
            if (
                window.WebApp &&
                typeof window.WebApp.openMaxLink ===
                    "function"
            ) {
                return "sdk";
            }

            return null;
        }

        /**
         * Отправляет событие напрямую контейнеру MAX.
         */
        function sendDirectEvent(type, payload = {}) {
            const transport = getTransport();

            if (transport === "iframe") {
                window.parent.postMessage(
                    JSON.stringify({
                        type,
                        ...payload
                    }),
                    "*"
                );

                return true;
            }

            if (transport === "webview") {
                window.WebViewHandler.postEvent(
                    type,
                    JSON.stringify(payload)
                );

                return true;
            }

            return false;
        }

        /**
         * Закрывает именно исходное мини-приложение.
         */
        function closeMiniApp(transport) {
            try {
                if (transport === "sdk") {
                    if (
                        window.WebApp &&
                        typeof window.WebApp.close ===
                            "function"
                    ) {
                        window.WebApp.close();
                    }

                    return;
                }

                sendDirectEvent(
                    "WebAppClose",
                    {}
                );
            } catch (error) {
                console.error(
                    "Не удалось закрыть мини-приложение:",
                    error
                );
            }
        }

        /**
         * Открывает канал и затем закрывает
         * текущее мини-приложение.
         */
        function openChannelAndClose() {
            if (transitionStarted) {
                return true;
            }

            const transport = getTransport();

            if (!transport) {
                return false;
            }

            transitionStarted = true;

            try {
                if (transport === "sdk") {
                    if (
                        typeof window.WebApp.ready ===
                            "function"
                    ) {
                        window.WebApp.ready();
                    }

                    window.WebApp.openMaxLink(
                        CHANNEL_URL
                    );
                } else {
                    sendDirectEvent(
                        "WebAppReady",
                        {}
                    );

                    sendDirectEvent(
                        "WebAppOpenMaxLink",
                        {
                            url: CHANNEL_URL
                        }
                    );
                }

                /*
                 * Не закрываем приложение сразу:
                 * MAX должен сначала обработать открытие канала.
                 */
                setTimeout(() => {
                    closeMiniApp(transport);
                }, CLOSE_DELAY_MS);

                return true;
            } catch (error) {
                transitionStarted = false;

                console.error(
                    "Ошибка открытия канала:",
                    error
                );

                return false;
            }
        }

        /*
         * Первая попытка — немедленно,
         * ещё до загрузки body.
         */
        if (openChannelAndClose()) {
            return;
        }

        /*
         * Иногда мост MAX появляется не в первый
         * момент выполнения страницы.
         */
        const retryTimer = setInterval(() => {
            retryCount += 1;

            if (
                openChannelAndClose() ||
                retryCount >= 100
            ) {
                clearInterval(retryTimer);
            }
        }, 10);
    })();
    </script>
</head>

<body>
    Открываем канал…
</body>
</html>
